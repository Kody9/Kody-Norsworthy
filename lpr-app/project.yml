name: PlateLog
options:
  bundleIdPrefix: com.kodynorsworthy
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  PlateLog:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SAL
        NSCameraUsageDescription: "SAL uses the camera to capture license plate photos for your personal log."
        NSLocationWhenInUseUsageDescription: "SAL records the location where each plate was captured."
        NSFaceIDUsageDescription: "SAL can use Face ID to lock the app when App Lock is turned on in Setup."
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodynorsworthy.platelog
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
